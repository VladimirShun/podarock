<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сюрприз для папы</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { color: #2c3e50; font-size: 28px; }
    button {
      padding: 15px 30px;
      font-size: 20px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    button:hover { background-color: #2980b9; }
    #ship-box {
      display: none;
      margin-top: 25px;
    }
    img { max-width: 350px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <h1>Папа, приходи скорее!</h1>
  <button onclick="showShip()">СЮРПРИЗ 🎉</button>

  <div id="ship-box">
    <img src="ship.jpg" alt="Корабль">
  </div>

  <script>
    function showShip() {
      document.getElementById('ship-box').style.display = 'block';
    }
  </script>
</body>
</html>
